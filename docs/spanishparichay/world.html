<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BhashaParichay | SpanishParichay World</title>
  <meta name="description" content="Play SpanishParichay beginner activities with Mithu.">
  <link rel="stylesheet" href="../assets/styles.css?v=20261112u7">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <nav class="main-nav" aria-label="Main">
      <a href="index.html" data-seamless-nav>Home</a>
      <a href="../index.html" data-seamless-nav>Language Chooser</a>
      <a href="../about.html" data-seamless-nav>About</a>
    </nav>
  </header>

  <main id="main-content" class="page-wrap">
    <section class="panel" id="languageWorldPage" data-language="spanish">
      <h1 id="mwTitle">World</h1>
      <p id="mwSubtitle"></p>
      <p><strong id="mwLessonName"></strong></p>
      <p id="mwLessonObjective"></p>
      <div id="mwMascot" class="parrot-mascot state-wave lesson-mascot" aria-live="polite">
        <svg viewBox="0 0 240 240" class="mithu-svg" role="img" aria-label="Mithu parrot mascot">
          <ellipse class="mithu-shadow" cx="120" cy="205" rx="54" ry="16"></ellipse>
          <path class="mithu-tail" d="M180 150 L220 180 L180 188 Z"></path>
          <ellipse class="mithu-body" cx="120" cy="120" rx="64" ry="78"></ellipse>
          <ellipse class="mithu-belly" cx="120" cy="138" rx="40" ry="48"></ellipse>
          <path class="mithu-wing-left" d="M78 112 C34 118, 28 168, 72 178 C74 152, 86 132, 98 124 Z"></path>
          <path class="mithu-wing-right" d="M162 112 C206 118, 212 168, 168 178 C166 152, 154 132, 142 124 Z"></path>
          <circle class="mithu-eye-left" cx="100" cy="96" r="8"></circle>
          <circle class="mithu-eye-right" cx="140" cy="96" r="8"></circle>
          <path class="mithu-beak-top" d="M108 110 L132 110 L120 126 Z"></path>
          <path class="mithu-beak-bottom" d="M110 124 L130 124 L120 138 Z"></path>
          <rect class="mithu-leg-left" x="104" y="184" width="8" height="20" rx="4"></rect>
          <rect class="mithu-leg-right" x="128" y="184" width="8" height="20" rx="4"></rect>
          <path class="mithu-crest" d="M104 45 L114 26 L122 44 L130 24 L140 45"></path>
        </svg>
        <p id="mwMascotSpeech" class="mascot-speech">Hola! I'm Mithu. Let's begin this world together.</p>
      </div>
      <div class="hero-actions">
        <div class="star-box">⭐ Stars: <span id="mwWorldStars">0</span></div>
        <div class="star-box">💎 Gems: <span id="mwWorldGems">0</span></div>
        <div class="star-box">✅ Lessons: <span id="mwLessonCount">0/1 completed</span></div>
      </div>
      <div class="hero-actions">
        <a class="button ghost" href="index.html" data-seamless-nav>Back to Spanish Home</a>
      </div>
    </section>

    <section class="panel" id="mwMatchPanel">
      <h2>Activity 1: Match</h2>
      <p id="mwMatchPrompt"></p>
      <div id="mwMatchChoices" class="choices"></div>
      <p id="mwMatchStatus" class="status"></p>
      <div class="hero-actions">
        <button id="mwMatchRestart" class="button ghost" type="button">Restart Match</button>
      </div>
    </section>

    <section class="panel" id="mwListenPanel">
      <h2>Activity 2: Listen</h2>
      <p id="mwListenPrompt"></p>
      <button id="mwListenPlay" class="button secondary" type="button">▶ Play</button>
      <div id="mwListenChoices" class="choices"></div>
      <p id="mwListenStatus" class="status"></p>
      <div class="hero-actions">
        <button id="mwListenRestart" class="button ghost" type="button">Restart Listen</button>
      </div>
    </section>

    <section class="panel" id="mwBuildPanel">
      <h2>Activity 3: Build</h2>
      <p id="mwBuildPrompt"></p>
      <div id="mwBuildTiles" class="tiles"></div>
      <p><strong>Your answer:</strong> <span id="mwBuildAnswer"></span></p>
      <div class="hero-actions">
        <button id="mwBuildCheck" class="button secondary" type="button">Check</button>
        <button id="mwBuildReset" class="button ghost" type="button">Clear</button>
        <button id="mwBuildRestart" class="button ghost" type="button">Restart Build</button>
      </div>
      <p id="mwBuildStatus" class="status"></p>
      <div class="hero-actions">
        <button id="mwCompleteLesson" class="button primary" type="button">Complete Lesson</button>
      </div>
    </section>
  </main>

  <script src="../assets/vendor/motion.min.js"></script>
  <script src="../assets/vendor/canvas-confetti.min.js"></script>
  <script src="../assets/multilingual-data.js?v=20261112u2"></script>
  <script src="../assets/mithu-follower.js?v=20261112u1"></script>
  <script src="../assets/shared-nav.js?v=20261112u1"></script>
  <script src="../assets/seamless-experience.js?v=20261112u1"></script>
  <script src="../assets/multilingual-world.js?v=20261112u4"></script>
</body>
</html>
